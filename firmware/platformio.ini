; Second Brain — NOG-OS firmware
; Two environments:
;   esp32-s3 : builds the real firmware (also the Wokwi target)
;   native   : compiles core/ on the host and runs Unity tests (no simulator)

[platformio]
src_dir = src

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; u8g2 draws the 128x64 mono UI. The UI code uses its C API (u8g2_t*), so the
; same drawing code also runs in the host render tool (tools/render/).
lib_deps =
    olikraus/U8g2@^2.36.18
build_flags =
    -std=gnu++17
    -I core
    -I hal
    -I ports/esp32s3
    -I app/ui
build_unflags =
    -std=gnu++11
; Compile sources from src/ plus the portable core/, the UI and the esp32s3 port.
build_src_filter =
    +<*>
    +<../core/>
    +<../ports/esp32s3/>
    +<../app/ui/>

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu++17
    -I core
    -I hal
    -I ports/native
build_src_filter =
    +<../core/>
