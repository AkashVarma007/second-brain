; Second Brain — Phase 2 firmware
; Two environments:
;   esp32-s3 : builds the real firmware (also the Wokwi target)
;   native   : compiles core/ on the host and runs Unity tests (no simulator)

[platformio]
src_dir = src

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    lvgl/lvgl@^8.3.4
    bodmer/TFT_eSPI@^2.5.23
build_flags =
    -std=gnu++17
    -I core
    -I hal
    -I ports/esp32s3
    -I app/ui
    ; ---- LVGL: configure via flags, no lv_conf.h ----
    -D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COLOR_DEPTH=16
    ; LV_COLOR_16_SWAP is left at its default (0): the flush uses
    ; tft.pushColors(..., swap=true), which already byte-swaps for the panel's
    ; big-endian wire order. Setting SWAP=1 too would double-swap -> wrong colors.
    ; LV_TICK_CUSTOM=1 makes LVGL read the system tick from Arduino millis().
    ; The INCLUDE ("Arduino.h") and SYS_TIME_EXPR ((millis())) are LVGL's own
    ; defaults for this mode, so they are NOT set as -D flags here: passing
    ; "(millis())" through the build_flags shell breaks it (unbalanced paren).
    -D LV_TICK_CUSTOM=1
    -D LV_USE_LOG=1
    ; LV_FONT_DEFAULT is left at LVGL's own default (&lv_font_montserrat_14 when
    ; that font is enabled below). Setting it via -D would pass a bare '&' through
    ; the build_flags shell, which reads it as "run in background" and breaks.
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_THEME_DEFAULT_DARK=1
    ; ---- TFT_eSPI: ILI9341 on ESP32-S3, configured via flags ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=7
    -D TFT_RST=6
    -D TFT_BL=14
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SPI_FREQUENCY=40000000
build_unflags =
    -std=gnu++11
; Compile sources from src/ plus the portable core/ and the esp32s3 port.
; app/ui/ is added here in Task 5 once that directory exists.
build_src_filter =
    +<*>
    +<../core/>
    +<../ports/esp32s3/>
    +<../app/ui/>

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu++17
    -I core
    -I hal
    -I ports/native
build_src_filter =
    +<../core/>
