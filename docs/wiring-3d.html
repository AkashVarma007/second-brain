<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain — Wiring Inspector</title>
<meta name="description" content="Interactive 3D viewer of the Second Brain Phase-2 ESP32-S3 wiring.">
</head>
<body>
<style>
  :root {
    --bg: #0a0f14;
    --panel: rgba(17, 26, 34, 0.82);
    --panel-solid: #111a22;
    --edge: #24333f;
    --ink: #d6e0ea;
    --ink-dim: #8397a6;
    --ink-faint: #5b6b78;
    --accent: #e0a35a;
    --accent-dim: #a97b43;
    --board: #1f6f54;
    --good: #3fae5a;
    --shadow: rgba(0, 0, 0, 0.45);
    --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eceae3;
      --panel: rgba(246, 244, 238, 0.86);
      --panel-solid: #f6f4ee;
      --edge: #d3cec2;
      --ink: #1f2a24;
      --ink-dim: #5d6b63;
      --ink-faint: #8b978d;
      --accent: #b06a2c;
      --accent-dim: #8a531f;
      --board: #2a8768;
      --shadow: rgba(120, 110, 90, 0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0f14; --panel: rgba(17,26,34,0.82); --panel-solid: #111a22;
    --edge: #24333f; --ink: #d6e0ea; --ink-dim: #8397a6; --ink-faint: #5b6b78;
    --accent: #e0a35a; --accent-dim: #a97b43; --board: #1f6f54; --good: #3fae5a;
    --shadow: rgba(0,0,0,0.45);
  }
  :root[data-theme="light"] {
    --bg: #eceae3; --panel: rgba(246,244,238,0.86); --panel-solid: #f6f4ee;
    --edge: #d3cec2; --ink: #1f2a24; --ink-dim: #5d6b63; --ink-faint: #8b978d;
    --accent: #b06a2c; --accent-dim: #8a531f; --board: #2a8768; --good: #2a8768;
    --shadow: rgba(120,110,90,0.25);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header.bar {
    display: flex; align-items: baseline; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--edge);
    flex-wrap: wrap;
  }
  header.bar h1 {
    font-size: 15px; font-weight: 650; margin: 0; letter-spacing: 0.2px;
  }
  header.bar .sub {
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim);
  }
  header.bar .stats {
    margin-left: auto; font-family: var(--font-mono); font-size: 12px;
    color: var(--ink-dim); display: flex; gap: 14px; flex-wrap: wrap;
  }
  header.bar .stats b { color: var(--accent); font-weight: 600; }

  .stage { position: relative; flex: 1; min-height: 0; }
  canvas#scene { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas#scene.dragging { cursor: grabbing; }

  .panel {
    position: absolute; top: 14px; right: 14px; width: 244px;
    background: var(--panel); backdrop-filter: blur(9px);
    border: 1px solid var(--edge); border-radius: 12px;
    padding: 12px; box-shadow: 0 8px 30px var(--shadow);
    max-height: calc(100% - 28px); overflow-y: auto;
  }
  .panel h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px;
    color: var(--ink-faint); margin: 0 0 8px; font-weight: 650;
  }
  .panel h2:not(:first-child) { margin-top: 16px; }

  .grp { display: flex; flex-direction: column; gap: 2px; }
  .grp label {
    display: flex; align-items: center; gap: 9px; padding: 5px 6px;
    border-radius: 7px; cursor: pointer; font-size: 13px;
    font-family: var(--font-mono);
  }
  .grp label:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .grp input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .grp .sw { width: 22px; height: 4px; border-radius: 2px; flex: none; }
  .grp .ct { margin-left: auto; color: var(--ink-faint); font-size: 11px; }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btns button {
    font-family: var(--font-mono); font-size: 12px; color: var(--ink);
    background: transparent; border: 1px solid var(--edge);
    border-radius: 8px; padding: 7px 8px; cursor: pointer; transition: all .12s;
  }
  .btns button:hover { border-color: var(--accent); color: var(--accent); }
  .btns button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-color: var(--accent); color: var(--accent);
  }
  .btns button.wide { grid-column: 1 / -1; }
  .btns button:focus-visible, .grp label:focus-within {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .legend { display: flex; flex-direction: column; gap: 1px; }
  .legend .row {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 6px; cursor: default; font-family: var(--font-mono); font-size: 11.5px;
  }
  .legend .row:hover, .legend .row.hot {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .legend .row .sw { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid var(--shadow); }
  .legend .row .nm { color: var(--ink); }
  .legend .row .to { margin-left: auto; color: var(--ink-faint); }
  .legend .row.off { opacity: .32; }

  .readout {
    border-top: 1px solid var(--edge); padding: 11px 18px;
    display: flex; align-items: center; gap: 16px; min-height: 58px;
    font-family: var(--font-mono);
  }
  .readout .swatch { width: 26px; height: 26px; border-radius: 7px; flex: none; border: 1px solid var(--shadow); }
  .readout .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .readout .sig { font-size: 15px; font-weight: 600; color: var(--ink); }
  .readout .path { font-size: 13px; color: var(--accent); }
  .readout .func { margin-left: auto; text-align: right; color: var(--ink-dim); font-size: 12.5px; max-width: 44%; }
  .readout .tag {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--ink-faint); border: 1px solid var(--edge);
    padding: 3px 7px; border-radius: 20px; flex: none;
  }
  .readout .hint { color: var(--ink-faint); font-size: 13px; }
  .readout.locked { box-shadow: inset 0 2px 0 var(--accent); }

  @media (max-width: 720px) {
    .panel { position: static; width: auto; margin: 0; border-radius: 0;
      border: none; border-top: 1px solid var(--edge); max-height: 40vh; backdrop-filter: none; }
    .stage { display: flex; flex-direction: column; }
    canvas#scene { flex: 1; }
    .app { overflow: auto; }
    .readout .func { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <header class="bar">
    <h1>Second Brain &middot; Wiring Inspector</h1>
    <span class="sub">Phase&nbsp;2 &mdash; ESP32-S3 + ILI9341 + 3 buttons</span>
    <div class="stats">
      <span><b>5</b> parts</span>
      <span><b>17</b> wires</span>
      <span><b>10</b> GPIO</span>
    </div>
  </header>

  <div class="stage">
    <canvas id="scene"></canvas>

    <aside class="panel">
      <h2>Wire groups</h2>
      <div class="grp" id="groups"></div>

      <h2>View</h2>
      <div class="btns">
        <button id="spin" aria-pressed="false">Spin</button>
        <button id="labels" aria-pressed="true">Labels</button>
        <button id="proj" aria-pressed="false">Isometric</button>
        <button id="reset">Reset</button>
        <button class="wide" id="theme">Toggle theme</button>
      </div>

      <h2>Netlist</h2>
      <div class="legend" id="legend"></div>
    </aside>
  </div>

  <div class="readout" id="readout">
    <span class="hint">Hover a wire to trace it &middot; drag to rotate &middot; scroll to zoom &middot; click a wire to lock it</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Netlist — the exact 17 connections from firmware/diagram.json.
  // Layout below is a *schematic* arrangement for legibility, not to physical
  // DevKit scale: display pins cluster right, buttons left, serial to the rear.
  // ---------------------------------------------------------------------------
  const V = (x, y, z) => ({ x, y, z });

  // ESP32-S3 header pin anchors (top surface of the board box).
  const FZ = 1.72, BZ = -1.72, PY = 0.30;
  const pins = {
    // front row, left cluster = buttons + their grounds
    "esp:4":     V(-3.5, PY, FZ), "esp:5":  V(-3.05, PY, FZ), "esp:15": V(-2.6, PY, FZ),
    "esp:GND.2": V(-2.15, PY, FZ), "esp:GND.3": V(-1.7, PY, FZ), "esp:GND.4": V(-1.25, PY, FZ),
    // front row, right cluster = display power + spi
    "esp:3V3.1": V(-0.4, PY, FZ), "esp:GND.1": V(0.05, PY, FZ), "esp:6": V(0.5, PY, FZ),
    "esp:7": V(0.95, PY, FZ), "esp:10": V(1.4, PY, FZ), "esp:11": V(1.85, PY, FZ),
    "esp:12": V(2.3, PY, FZ), "esp:13": V(2.75, PY, FZ), "esp:14": V(3.2, PY, FZ),
    // back row = USB serial
    "esp:TX": V(2.9, PY, BZ), "esp:RX": V(3.4, PY, BZ),

    // ILI9341 pins along its lower edge (right side, standing panel)
    "lcd:VCC": V(4.9, 0.15, 1.2), "lcd:GND": V(5.1, 0.15, 1.2), "lcd:RST": V(5.3, 0.15, 1.2),
    "lcd:D/C": V(5.5, 0.15, 1.2), "lcd:CS": V(5.7, 0.15, 1.2), "lcd:MOSI": V(5.9, 0.15, 1.2),
    "lcd:SCK": V(6.1, 0.15, 1.2), "lcd:MISO": V(6.3, 0.15, 1.2), "lcd:LED": V(6.5, 0.15, 1.2),

    // buttons (left), each: signal pin toward board + ground pin
    "btnDown:s":   V(-5.35, 0.28, 1.25), "btnDown:g":   V(-5.35, 0.28, 1.0),
    "btnSelect:s": V(-5.35, 0.28, 0.05), "btnSelect:g": V(-5.35, 0.28, -0.2),
    "btnBack:s":   V(-5.35, 0.28, -1.15), "btnBack:g":  V(-5.35, 0.28, -1.4),

    // USB / serial console stand-in (rear right)
    "usb:TX": V(5.2, 0.4, -1.7), "usb:RX": V(5.55, 0.4, -1.7),
  };

  const nets = [
    { g:"power", sig:"VCC",  col:"red",    a:"lcd:VCC",  b:"esp:3V3.1", from:"lcd:VCC",  to:"3V3.1", fn:"Display 3.3 V supply" },
    { g:"power", sig:"GND",  col:"black",  a:"lcd:GND",  b:"esp:GND.1", from:"lcd:GND",  to:"GND.1", fn:"Display ground" },
    { g:"power", sig:"GND",  col:"black",  a:"btnDown:g",   b:"esp:GND.2", from:"btnDown", to:"GND.2", fn:"DOWN button return" },
    { g:"power", sig:"GND",  col:"black",  a:"btnSelect:g", b:"esp:GND.3", from:"btnSelect", to:"GND.3", fn:"SELECT button return" },
    { g:"power", sig:"GND",  col:"black",  a:"btnBack:g",   b:"esp:GND.4", from:"btnBack", to:"GND.4", fn:"BACK button return" },

    { g:"spi", sig:"CS",   col:"orange", a:"lcd:CS",   b:"esp:10", from:"lcd:CS",   to:"GPIO10", fn:"SPI chip-select (active low)" },
    { g:"spi", sig:"RST",  col:"yellow", a:"lcd:RST",  b:"esp:6",  from:"lcd:RST",  to:"GPIO6",  fn:"Hardware reset" },
    { g:"spi", sig:"D/C",  col:"green",  a:"lcd:D/C",  b:"esp:7",  from:"lcd:D/C",  to:"GPIO7",  fn:"Data / Command select" },
    { g:"spi", sig:"MOSI", col:"blue",   a:"lcd:MOSI", b:"esp:11", from:"lcd:MOSI", to:"GPIO11", fn:"SPI data, MCU → display" },
    { g:"spi", sig:"SCK",  col:"purple", a:"lcd:SCK",  b:"esp:12", from:"lcd:SCK",  to:"GPIO12", fn:"SPI clock (40 MHz)" },
    { g:"spi", sig:"LED",  col:"white",  a:"lcd:LED",  b:"esp:14", from:"lcd:LED",  to:"GPIO14", fn:"Backlight enable (active HIGH)" },
    { g:"spi", sig:"MISO", col:"gray",   a:"lcd:MISO", b:"esp:13", from:"lcd:MISO", to:"GPIO13", fn:"SPI data, display → MCU (idle)" },

    { g:"buttons", sig:"DOWN",   col:"green", a:"btnDown:s",   b:"esp:4",  from:"btnDown",   to:"GPIO4",  fn:"Cursor down (active low, pull-up)" },
    { g:"buttons", sig:"SELECT", col:"blue",  a:"btnSelect:s", b:"esp:5",  from:"btnSelect", to:"GPIO5",  fn:"Enter / confirm (active low, pull-up)" },
    { g:"buttons", sig:"BACK",   col:"red",   a:"btnBack:s",   b:"esp:15", from:"btnBack",   to:"GPIO15", fn:"Up a level (active low, pull-up)" },

    { g:"serial", sig:"TX", col:"teal", a:"esp:TX", b:"usb:RX", from:"esp:TX", to:"console RX", fn:"Firmware logs → serial monitor" },
    { g:"serial", sig:"RX", col:"teal", a:"esp:RX", b:"usb:TX", from:"esp:RX", to:"console TX", fn:"Serial monitor → firmware" },
  ];

  const groupMeta = {
    power:   { name:"Power & ground", col:"#e5484d" },
    spi:     { name:"Display (SPI)",  col:"#4a7bd6" },
    buttons: { name:"Buttons",        col:"#3fae5a" },
    serial:  { name:"Serial (sim)",   col:"#38b2ac" },
  };

  // Boxes: [cx,cy,cz, sx,sy,sz, baseColor, label, labelAnchorY]
  const boxes = [
    { c:V(0,0.05,0),    s:V(8.6,0.4,3.9),  col:"#1f6f54", label:"ESP32-S3",  ly:0.32 },
    { c:V(5.7,1.55,1.2),s:V(2.9,3.0,0.24), col:"#12202b", label:"ILI9341",   ly:3.1, screen:true },
    { c:V(-5.9,0.3,1.15),s:V(0.85,0.6,0.85),col:"#3fae5a", label:"DOWN",     ly:0.66, cap:"#3fae5a" },
    { c:V(-5.9,0.3,0),  s:V(0.85,0.6,0.85),col:"#4a7bd6", label:"SELECT",    ly:0.66, cap:"#4a7bd6" },
    { c:V(-5.9,0.3,-1.15),s:V(0.85,0.6,0.85),col:"#e5484d",label:"BACK",     ly:0.66, cap:"#e5484d" },
    { c:V(5.35,0.35,-1.75),s:V(1.1,0.6,0.5),col:"#3a4650", label:"USB",      ly:0.7 },
  ];

  // --- wire colour resolution (theme aware so black/white stay visible) -----
  function wireColor(name, dark) {
    const D = { red:"#e5484d", black:"#5b6672", orange:"#e8823a", yellow:"#e5c04a",
      green:"#43b85e", blue:"#5a86dd", purple:"#a074dd", white:"#e8edf2", gray:"#8a97a3", teal:"#38b2ac" };
    const L = { red:"#d13438", black:"#2a2f36", orange:"#c86a1e", yellow:"#b8901a",
      green:"#2a8843", blue:"#3a63c0", purple:"#7c4fc0", white:"#9aa2ab", gray:"#69747d", teal:"#1f8a84" };
    return (dark ? D : L)[name] || "#888";
  }

  // ---------------------------------------------------------------------------
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;

  const view = { yaw: -0.62, pitch: 0.52, zoom: 1, iso: false };
  let dirty = true, spinning = false;
  let hovered = null, locked = null;
  const groupsOn = { power:true, spi:true, buttons:true, serial:true };
  let showLabels = true;

  function isDark() {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return matchMedia("(prefers-color-scheme: dark)").matches;
  }
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function resize() {
    const r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    dirty = true;
  }

  // rotate a point by yaw (Y) then pitch (X)
  function rot(p) {
    const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw);
    let x = p.x * cy + p.z * sy;
    let z = -p.x * sy + p.z * cy;
    const cx = Math.cos(view.pitch), sx = Math.sin(view.pitch);
    let y = p.y * cx - z * sx;
    z = p.y * sx + z * cx;
    return { x, y, z };
  }
  const CAM = 15, FOC = 780;
  function project(p) {
    const r = rot(p);
    const depth = CAM - r.z;
    const s = view.iso ? (FOC / CAM) : (FOC / Math.max(depth, 0.1));
    return { X: W / 2 + r.x * s * view.zoom, Y: H / 2 - r.y * s * view.zoom, depth, r };
  }

  function boxFaces(b) {
    const { c, s } = b;
    const hx = s.x/2, hy = s.y/2, hz = s.z/2;
    const V8 = [
      V(c.x-hx,c.y-hy,c.z-hz), V(c.x+hx,c.y-hy,c.z-hz), V(c.x+hx,c.y+hy,c.z-hz), V(c.x-hx,c.y+hy,c.z-hz),
      V(c.x-hx,c.y-hy,c.z+hz), V(c.x+hx,c.y-hy,c.z+hz), V(c.x+hx,c.y+hy,c.z+hz), V(c.x-hx,c.y+hy,c.z+hz),
    ];
    const idx = [[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]];
    const top = 4; // face index 4 = top (y+)
    return idx.map((f, i) => ({ verts: f.map(k => V8[k]), box: b, isTop: i === top }));
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n>>16)&255, g = (n>>8)&255, bl = n&255;
    r = Math.max(0, Math.min(255, Math.round(r*amt)));
    g = Math.max(0, Math.min(255, Math.round(g*amt)));
    bl = Math.max(0, Math.min(255, Math.round(bl*amt)));
    return `rgb(${r},${g},${bl})`;
  }

  function draw() {
    dirty = false;
    const dark = isDark();
    const bg = cssVar("--bg");
    const ink = cssVar("--ink"), inkDim = cssVar("--ink-faint"), accent = cssVar("--accent");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // faces (painter's algorithm)
    const faces = [];
    boxes.forEach(b => boxFaces(b).forEach(f => {
      const pr = f.verts.map(project);
      const avg = pr.reduce((a, p) => a + p.depth, 0) / pr.length;
      faces.push({ f, pr, avg });
    }));
    faces.sort((a, z) => z.avg - a.avg);

    const light = { x: 0.35, y: 0.72, z: 0.6 };
    for (const { f, pr } of faces) {
      // face normal from rotated coords
      const a = pr[0].r, b = pr[1].r, c = pr[2].r;
      const ux = b.x-a.x, uy = b.y-a.y, uz = b.z-a.z;
      const vx = c.x-a.x, vy = c.y-a.y, vz = c.z-a.z;
      let nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx;
      const ln = Math.hypot(nx,ny,nz) || 1; nx/=ln; ny/=ln; nz/=ln;
      const diff = Math.max(0, nx*light.x + ny*light.y + nz*light.z);
      const amt = 0.5 + 0.62 * diff;
      ctx.beginPath();
      ctx.moveTo(pr[0].X, pr[0].Y);
      for (let i=1;i<pr.length;i++) ctx.lineTo(pr[i].X, pr[i].Y);
      ctx.closePath();
      ctx.fillStyle = shade(f.box.col, amt);
      ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = dark ? "rgba(0,0,0,0.35)" : "rgba(90,80,60,0.25)";
      ctx.stroke();
      // screen glow on the display front face (top-ish, facing camera)
      if (f.box.screen && f.isTop === false && nz > 0.4) {
        ctx.save();
        ctx.clip();
        const g = ctx.createLinearGradient(pr[0].X, pr[0].Y, pr[2].X, pr[2].Y);
        g.addColorStop(0, "rgba(90,180,200,0.28)");
        g.addColorStop(1, "rgba(30,60,90,0.10)");
        ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
        ctx.restore();
      }
    }

    // wires (cache projected polylines for hit-testing)
    const casing = bg;
    for (const net of nets) {
      net._proj = null;
      if (!groupsOn[net.g]) continue;
      const A = pins[net.a], B = pins[net.b];
      const dist = Math.hypot(A.x-B.x, A.y-B.y, A.z-B.z);
      const lift = 0.5 + dist * 0.22;
      const M = V((A.x+B.x)/2, Math.max(A.y,B.y)+lift, (A.z+B.z)/2);
      const N = 26, poly = [];
      for (let i=0;i<=N;i++){
        const t = i/N, mt = 1-t;
        const p = V(mt*mt*A.x+2*mt*t*M.x+t*t*B.x, mt*mt*A.y+2*mt*t*M.y+t*t*B.y, mt*mt*A.z+2*mt*t*M.z+t*t*B.z);
        poly.push(project(p));
      }
      net._proj = poly;
      const hot = net === hovered || net === locked;
      const dim = (hovered || locked) && !hot;
      const col = wireColor(net.col, dark);
      // casing
      ctx.beginPath(); ctx.moveTo(poly[0].X, poly[0].Y);
      for (let i=1;i<poly.length;i++) ctx.lineTo(poly[i].X, poly[i].Y);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.lineWidth = (hot ? 7 : 5.5); ctx.strokeStyle = casing;
      ctx.globalAlpha = dim ? 0.5 : 1; ctx.stroke();
      // colour
      ctx.lineWidth = hot ? 4.2 : 2.6; ctx.strokeStyle = col;
      ctx.globalAlpha = dim ? 0.28 : 1; ctx.stroke();
      ctx.globalAlpha = 1;
      // endpoint nodes
      for (const end of [poly[0], poly[poly.length-1]]) {
        ctx.beginPath(); ctx.arc(end.X, end.Y, hot ? 4.4 : 3, 0, 7);
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = 1.3; ctx.strokeStyle = casing; ctx.stroke();
      }
    }

    // labels
    if (showLabels) {
      ctx.font = "600 12px " + cssVar("--font-mono");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      // component labels
      for (const b of boxes) {
        const p = project(V(b.c.x, b.c.y + b.ly, b.c.z));
        drawTag(p.X, p.Y, b.label, ink, bg, 700);
      }
      // esp pin labels
      ctx.font = "500 10.5px " + cssVar("--font-mono");
      for (const key in pins) {
        if (!key.startsWith("esp:")) continue;
        const used = nets.some(n => (n.a===key||n.b===key) && groupsOn[n.g]);
        if (!used) continue;
        const p = project(pins[key]);
        drawTag(p.X, p.Y - 13, key.slice(4), inkDim, bg, 500);
      }
    }
    function drawTag(x, y, text, fg, bgc, weight) {
      ctx.font = `${weight} ${weight>600?12:10.5}px ` + cssVar("--font-mono");
      const w = ctx.measureText(text).width + 8;
      ctx.globalAlpha = 0.82; ctx.fillStyle = bgc;
      roundRect(x - w/2, y - 8, w, 16, 4); ctx.fill();
      ctx.globalAlpha = 1; ctx.fillStyle = fg;
      ctx.fillText(text, x, y);
    }
    function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  }

  // hit-test: nearest visible wire to cursor
  function pick(mx, my) {
    let best = null, bestD = 10;
    for (const net of nets) {
      if (!net._proj) continue;
      const p = net._proj;
      for (let i=1;i<p.length;i++){
        const d = segDist(mx, my, p[i-1].X, p[i-1].Y, p[i].X, p[i].Y);
        if (d < bestD) { bestD = d; best = net; }
      }
    }
    return best;
  }
  function segDist(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1, l2=dx*dx+dy*dy;
    let t = l2 ? ((px-x1)*dx+(py-y1)*dy)/l2 : 0; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  // ---- readout ----
  const readout = document.getElementById("readout");
  function renderReadout() {
    const net = locked || hovered;
    readout.classList.toggle("locked", !!locked);
    if (!net) {
      readout.innerHTML = '<span class="hint">Hover a wire to trace it &middot; drag to rotate &middot; scroll to zoom &middot; click a wire to lock it</span>';
      return;
    }
    const col = wireColor(net.col, isDark());
    readout.innerHTML = "";
    const sw = el("div","swatch"); sw.style.background = col; readout.appendChild(sw);
    const main = el("div","main");
    main.appendChild(el("div","sig", net.sig + (locked ? "  ◉ locked" : "")));
    main.appendChild(el("div","path", net.from + "  →  " + net.to));
    readout.appendChild(main);
    readout.appendChild(el("div","tag", net.col + " wire"));
    readout.appendChild(el("div","func", net.fn));
  }
  function el(t, c, txt){ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; }

  // ---- side panel: groups + legend ----
  const groupsBox = document.getElementById("groups");
  for (const key in groupMeta) {
    const m = groupMeta[key];
    const count = nets.filter(n => n.g === key).length;
    const lab = document.createElement("label");
    lab.innerHTML = `<input type="checkbox" checked><span class="sw" style="background:${m.col}"></span>${m.name}<span class="ct">${count}</span>`;
    lab.querySelector("input").addEventListener("change", e => {
      groupsOn[key] = e.target.checked;
      if (hovered && !groupsOn[hovered.g]) hovered = null;
      if (locked && !groupsOn[locked.g]) locked = null;
      buildLegend(); renderReadout(); dirty = true;
    });
    groupsBox.appendChild(lab);
  }

  const legendBox = document.getElementById("legend");
  function buildLegend() {
    legendBox.innerHTML = "";
    nets.forEach(net => {
      const row = el("div","row");
      if (!groupsOn[net.g]) row.classList.add("off");
      const col = wireColor(net.col, isDark());
      row.innerHTML = `<span class="sw" style="background:${col}"></span><span class="nm">${net.sig}</span><span class="to">${net.to}</span>`;
      row.addEventListener("mouseenter", () => { if (groupsOn[net.g]) { hovered = net; renderReadout(); dirty = true; } });
      row.addEventListener("mouseleave", () => { if (!locked) { hovered = null; renderReadout(); } dirty = true; });
      row.addEventListener("click", () => { if (groupsOn[net.g]) { locked = (locked===net?null:net); renderReadout(); dirty = true; } });
      net._row = row;
      legendBox.appendChild(row);
    });
  }

  // ---- interaction ----
  let drag = null;
  canvas.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, moved: 0 };
    canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      view.yaw += dx * 0.008;
      view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch + dy * 0.008));
      drag.x = e.clientX; drag.y = e.clientY; dirty = true;
    } else {
      const net = pick(e.clientX - r.left, e.clientY - r.top);
      if (net !== hovered) { hovered = net; renderReadout(); syncLegendHot(); dirty = true; }
      canvas.style.cursor = net ? "pointer" : "grab";
    }
  });
  canvas.addEventListener("pointerup", e => {
    canvas.classList.remove("dragging");
    if (drag && drag.moved < 5) {
      const r = canvas.getBoundingClientRect();
      const net = pick(e.clientX - r.left, e.clientY - r.top);
      locked = net ? (locked === net ? null : net) : null;
      renderReadout(); dirty = true;
    }
    drag = null;
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    view.zoom = Math.max(0.45, Math.min(3.2, view.zoom * (1 - e.deltaY * 0.0012)));
    dirty = true;
  }, { passive: false });

  function syncLegendHot() {
    nets.forEach(n => n._row && n._row.classList.toggle("hot", n === hovered || n === locked));
  }

  // ---- view buttons ----
  const btnSpin = document.getElementById("spin");
  const btnLabels = document.getElementById("labels");
  const btnProj = document.getElementById("proj");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  btnSpin.addEventListener("click", () => { spinning = !spinning; btnSpin.setAttribute("aria-pressed", spinning); });
  btnLabels.addEventListener("click", () => { showLabels = !showLabels; btnLabels.setAttribute("aria-pressed", showLabels); dirty = true; });
  btnProj.addEventListener("click", () => { view.iso = !view.iso; btnProj.setAttribute("aria-pressed", view.iso); btnProj.textContent = view.iso ? "Perspective" : "Isometric"; dirty = true; });
  document.getElementById("reset").addEventListener("click", () => {
    view.yaw = -0.62; view.pitch = 0.52; view.zoom = 1; dirty = true;
  });
  document.getElementById("theme").addEventListener("click", () => {
    const cur = isDark(); document.documentElement.setAttribute("data-theme", cur ? "light" : "dark");
    buildLegend(); renderReadout(); dirty = true;
  });

  // ---- loop ----
  function frame() {
    if (spinning && !reduceMotion) { view.yaw += 0.0045; dirty = true; }
    if (dirty) draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { buildLegend(); renderReadout(); dirty = true; });
  new MutationObserver(() => { buildLegend(); renderReadout(); dirty = true; })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  buildLegend(); renderReadout(); resize(); frame();
})();
</script>
</body>
</html>
